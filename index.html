<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İmam Müezzinlik Sıralama Sistemi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🕌 İmam Müezzinlik Sıralama Sistemi</h1>
            <p>Kıraat Talebe Takip Paneli</p>
        </header>

        <div class="main-content">
            <!-- Talebe Ekleme Formu -->
            <div class="card">
                <h2>📝 Yeni Talebe Ekle</h2>
                <form id="talebeForm">
                    <div class="form-group">
                        <label>Ad:</label>
                        <input type="text" id="ad" required>
                    </div>
                    <div class="form-group">
                        <label>Soyad:</label>
                        <input type="text" id="soyad" required>
                    </div>
                    <div class="form-group">
                        <label>Sınıf:</label>
                        <select id="sinif" required>
                            <option value="">Seçiniz</option>
                            <option value="1">1. Sınıf</option>
                            <option value="2">2. Sınıf</option>
                            <option value="3">3. Sınıf</option>
                            <option value="4">4. Sınıf</option>
                            <option value="5">5. Sınıf</option>
                            <option value="6">6. Sınıf</option>
                            <option value="7">7. Sınıf</option>
                            <option value="8">8. Sınıf</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-primary">Talebe Ekle</button>
                </form>
            </div>

            <!-- Talebeler Butonu -->
            <div class="card">
                <button id="talebeListBtn" class="btn-large">
                    👥 Talebeler Listesi
                    <span id="talebeCount">0</span>
                </button>
            </div>
        </div>

        <!-- Talebeler Modal Penceresi -->
        <div id="talebeModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>👥 Tüm Talebeler</h2>
                    <span class="close">&times;</span>
                </div>
                <div class="modal-body">
                    <div id="talebeListesi"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
